name: ScreenInk - Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate ScreenInk project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/screenink/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ScreenInk"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.screenink.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.screenink.app"
                  minSdk = 26
                  targetSdk = 32
                  versionCode = 2
                  versionName = "2.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="ScreenInkTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#8B7CFF</item>
                  <item name="android:statusBarColor">#10111B</item>
                  <item name="android:navigationBarColor">#10111B</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application
                  android:allowBackup="false"
                  android:label="ScreenInk"
                  android:theme="@style/ScreenInkTheme"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:stopWithTask="false"/>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/screenink/app/MainActivity.kt <<'EOF'
          package com.screenink.app

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.graphics.Color
          import android.graphics.Typeface
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import android.graphics.drawable.GradientDrawable

          class MainActivity : Activity() {

              private fun background(color: Int, radius: Float): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(color)
                      cornerRadius = radius
                  }
              }

              private fun makeButton(text: String, action: () -> Unit): Button {
                  return Button(this).apply {
                      this.text = text
                      textSize = 15f
                      isAllCaps = false
                      setTextColor(Color.WHITE)
                      background = background(Color.rgb(91, 77, 190), 28f)
                      setPadding(20, 14, 20, 14)
                      setOnClickListener { action() }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(28, 55, 28, 30)
                      setBackgroundColor(Color.rgb(15, 16, 28))
                  }

                  val title = TextView(this).apply {
                      text = "ScreenInk"
                      textSize = 34f
                      setTextColor(Color.WHITE)
                      typeface = Typeface.create("sans-serif-medium", Typeface.BOLD)
                  }

                  val subtitle = TextView(this).apply {
                      text = "Your screen. Your canvas."
                      textSize = 15f
                      setTextColor(Color.LTGRAY)
                      setPadding(0, 8, 0, 35)
                  }

                  val info = TextView(this).apply {
                      text = "Draw, annotate and highlight over any app using a floating glass toolbar."
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(12, 20, 12, 30)
                  }

                  root.addView(title)
                  root.addView(subtitle)
                  root.addView(info)

                  root.addView(makeButton("①  Grant overlay permission") {
                      if (!Settings.canDrawOverlays(this)) {
                          val intent = Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:$packageName")
                          )
                          startActivity(intent)
                      } else {
                          Toast.makeText(this, "Permission already granted", Toast.LENGTH_SHORT).show()
                      }
                  })

                  root.addView(makeButton("②  Start ScreenInk") {
                      if (Settings.canDrawOverlays(this)) {
                          val intent = Intent(this, OverlayService::class.java)
                          startService(intent)
                          Toast.makeText(this, "ScreenInk started", Toast.LENGTH_SHORT).show()
                      } else {
                          Toast.makeText(this, "Grant overlay permission first", Toast.LENGTH_LONG).show()
                      }
                  }.apply {
                      val p = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                      p.topMargin = 18
                      layoutParams = p
                  })

                  root.addView(makeButton("Stop ScreenInk") {
                      stopService(Intent(this, OverlayService::class.java))
                  }.apply {
                      val p = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                      p.topMargin = 12
                      layoutParams = p
                  })

                  val footer = TextView(this).apply {
                      text = "SCREENINK  •  VERSION 2.0"
                      textSize = 11f
                      setTextColor(Color.GRAY)
                      gravity = Gravity.CENTER
                      setPadding(0, 45, 0, 0)
                  }
                  root.addView(footer)

                  setContentView(root)
              }
          }
          EOF

          cat > app/src/main/java/com/screenink/app/InkEngine.kt <<'EOF'
          package com.screenink.app

          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PorterDuff
          import android.graphics.PorterDuffXfermode
          import android.os.Handler
          import android.os.Looper

          enum class InkTool {
              PEN, BRUSH, HIGHLIGHTER, ERASER, LASER,
              LINE, ARROW, RECTANGLE, CIRCLE
          }

          data class InkStroke(
              val path: Path,
              val paint: Paint,
              val laser: Boolean = false
          )

          object InkEngine {
              val strokes = mutableListOf<InkStroke>()
              val undone = mutableListOf<InkStroke>()

              var tool = InkTool.PEN
              var color = Color.rgb(255, 75, 100)
              var width = 5f

              private var activePath: Path? = null
              private var activePaint: Paint? = null
              private var startX = 0f
              private var startY = 0f
              private var lastX = 0f
              private var lastY = 0f

              private val handler = Handler(Looper.getMainLooper())

              private fun createPaint(): Paint {
                  val p = Paint(Paint.ANTI_ALIAS_FLAG)
                  p.style = Paint.Style.STROKE
                  p.strokeCap = Paint.Cap.ROUND
                  p.strokeJoin = Paint.Join.ROUND

                  when (tool) {
                      InkTool.BRUSH -> {
                          p.color = color
                          p.strokeWidth = width * 2.2f
                      }
                      InkTool.HIGHLIGHTER -> {
                          p.color = color
                          p.alpha = 90
                          p.strokeWidth = width * 4f
                          p.strokeCap = Paint.Cap.SQUARE
                      }
                      InkTool.ERASER -> {
                          p.color = Color.TRANSPARENT
                          p.strokeWidth = width * 5f
                          p.xfermode = PorterDuffXfermode(PorterDuff.Mode.CLEAR)
                      }
                      InkTool.LASER -> {
                          p.color = Color.RED
                          p.strokeWidth = width * 1.5f
                          p.setShadowLayer(16f, 0f, 0f, Color.RED)
                      }
                      else -> {
                          p.color = color
                          p.strokeWidth = width
                      }
                  }
                  return p
              }

              fun start(x: Float, y: Float) {
                  startX = x
                  startY = y
                  lastX = x
                  lastY = y

                  activePath = Path()
                  activePath?.moveTo(x, y)

                  activePaint = createPaint()

                  if (tool == InkTool.ERASER) {
                      activePaint?.xfermode =
                          PorterDuffXfermode(PorterDuff.Mode.CLEAR)
                  }
              }

              fun move(x: Float, y: Float) {
                  val path = activePath ?: return

                  when (tool) {
                      InkTool.LINE -> {
                          path.reset()
                          path.moveTo(startX, startY)
                          path.lineTo(x, y)
                      }

                      InkTool.RECTANGLE -> {
                          path.reset()
                          path.addRect(startX, startY, x, y, Path.Direction.CW)
                      }

                      InkTool.CIRCLE -> {
                          path.reset()
                          val radius = kotlin.math.hypot(
                              (x - startX).toDouble(),
                              (y - startY).toDouble()
                          ).toFloat()
                          path.addCircle(startX, startY, radius, Path.Direction.CW)
                      }

                      InkTool.ARROW -> {
                          path.reset()
                          path.moveTo(startX, startY)
                          path.lineTo(x, y)

                          val angle = kotlin.math.atan2(
                              (y - startY).toDouble(),
                              (x - startX).toDouble()
                          )
                          val head = 28f
                          val a1 = angle + 2.65
                          val a2 = angle - 2.65

                          path.moveTo(x, y)
                          path.lineTo(
                              x + head * kotlin.math.cos(a1).toFloat(),
                              y + head * kotlin.math.sin(a1).toFloat()
                          )
                          path.moveTo(x, y)
                          path.lineTo(
                              x + head * kotlin.math.cos(a2).toFloat(),
                              y + head * kotlin.math.sin(a2).toFloat()
                          )
                      }

                      else -> {
                          path.quadTo(lastX, lastY, (lastX + x) / 2f, (lastY + y) / 2f)
                      }
                  }

                  lastX = x
                  lastY = y
              }

              fun finish() {
                  val path = activePath ?: return
                  val paint = activePaint ?: return

                  val laser = tool == InkTool.LASER
                  val stroke = InkStroke(Path(path), Paint(paint), laser)

                  strokes.add(stroke)
                  undone.clear()

                  if (laser) {
                      handler.postDelayed({
                          strokes.remove(stroke)
                          OverlayService.refreshDrawing()
                      }, 700)
                  }

                  activePath = null
                  activePaint = null
              }

              fun undo() {
                  if (strokes.isNotEmpty()) {
                      undone.add(strokes.removeAt(strokes.lastIndex))
                  }
              }

              fun redo() {
                  if (undone.isNotEmpty()) {
                      strokes.add(undone.removeAt(undone.lastIndex))
                  }
              }

              fun clear() {
                  strokes.clear()
                  undone.clear()
              }

              fun draw(canvas: Canvas) {
                  for (stroke in strokes) {
                      canvas.drawPath(stroke.path, stroke.paint)
                  }

                  if (activePath != null && activePaint != null) {
                      canvas.drawPath(activePath!!, activePaint!!)
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/screenink/app/DrawView.kt <<'EOF'
          package com.screenink.app

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.view.MotionEvent
          import android.view.View

          class DrawView(context: Context) : View(context) {

              init {
                  setBackgroundColor(Color.TRANSPARENT)
                  setLayerType(View.LAYER_TYPE_SOFTWARE, null)
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  InkEngine.draw(canvas)
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  when (event.action) {
                      MotionEvent.ACTION_DOWN -> {
                          InkEngine.start(event.x, event.y)
                          invalidate()
                          return true
                      }
                      MotionEvent.ACTION_MOVE -> {
                          InkEngine.move(event.x, event.y)
                          invalidate()
                          return true
                      }
                      MotionEvent.ACTION_UP,
                      MotionEvent.ACTION_CANCEL -> {
                          InkEngine.finish()
                          invalidate()
                          return true
                      }
                  }
                  return true
              }
          }
          EOF

