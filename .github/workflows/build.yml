name: Build ScreenInk Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Generate ScreenInk APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Android project
        run: |
          mkdir -p app/src/main/java/com/screenink/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ScreenInk"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.screenink.app"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.screenink.app"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="ScreenInk"
                  android:allowBackup="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".OverlayService"
                      android:exported="false"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/screenink/app/MainActivity.kt <<'EOF'
          package com.screenink.app

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(32, 60, 32, 32)
                  }
                  layout.addView(TextView(this).apply {
                      text = "ScreenInk\nScreen Annotation Tool"
                      textSize = 25f
                  })
                  val permission = Button(this).apply {
                      text = "Grant Overlay Permission"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:$packageName")))
                      }
                  }
                  layout.addView(permission)
                  layout.addView(Button(this).apply {
                      text = "Start ScreenInk"
                      setOnClickListener {
                          if (Settings.canDrawOverlays(this@MainActivity)) {
                              startService(Intent(this@MainActivity, OverlayService::class.java))
                          } else {
                              permission.performClick()
                          }
                      }
                  })
                  layout.addView(Button(this).apply {
                      text = "Stop ScreenInk"
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, OverlayService::class.java))
                      }
                  })
                  setContentView(layout)
              }
          }
          EOF

          cat > app/src/main/java/com/screenink/app/OverlayService.kt <<'EOF'
          package com.screenink.app

          import android.app.Service
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.os.IBinder
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.LinearLayout

          class OverlayService : Service() {
              private lateinit var wm: WindowManager
              private var panel: LinearLayout? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (panel != null) return START_NOT_STICKY
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager

                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(8, 8, 8, 8)
                      setBackgroundColor(Color.argb(225, 35, 35, 45))
                  }

                  fun add(label: String, action: () -> Unit) {
                      bar.addView(Button(this).apply {
                          text = label
                          textSize = 10f
                          setOnClickListener { action() }
                      })
                  }

                  add("DRAW") { DrawOverlay.mode = "pen" }
                  add("BRUSH") { DrawOverlay.mode = "brush" }
                  add("HIGHLIGHT") { DrawOverlay.mode = "highlight" }
                  add("ERASE") { DrawOverlay.mode = "erase" }
                  add("UNDO") { DrawOverlay.undo() }
                  add("CLEAR") { DrawOverlay.clear() }
                  add("X") { stopSelf() }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      y = 100
                  }

                  panel = bar
                  wm.addView(bar, params)
                  return START_NOT_STICKY
              }

              override fun onDestroy() {
                  panel?.let { wm.removeView(it) }
                  panel = null
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          cat > app/src/main/java/com/screenink/app/DrawOverlay.kt <<'EOF'
          package com.screenink.app

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.view.MotionEvent
          import android.view.View

          object DrawOverlay {
              var mode = "pen"
              private val paths = mutableListOf<Pair<Path, Paint>>()
              private var current: Path? = null
              private var currentPaint: Paint? = null

              fun undo() {
                  if (paths.isNotEmpty()) paths.removeAt(paths.lastIndex)
              }

              fun clear() {
                  paths.clear()
              }

              fun begin(x: Float, y: Float) {
                  current = Path().apply { moveTo(x, y) }
                  currentPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = when (mode) {
                          "highlight" -> Color.YELLOW
                          "erase" -> Color.TRANSPARENT
                          else -> Color.RED
                      }
                      strokeWidth = when (mode) {
                          "brush" -> 14f
                          "highlight" -> 28f
                          else -> 5f
                      }
                      style = Paint.Style.STROKE
                      strokeCap = Paint.Cap.ROUND
                      strokeJoin = Paint.Join.ROUND
                  }
                  current?.let { p -> currentPaint?.let { paths.add(p to it) } }
              }

              fun move(x: Float, y: Float) {
                  current?.lineTo(x, y)
              }

              fun finish() {
                  current = null
                  currentPaint = null
              }

              fun draw(canvas: Canvas) {
                  paths.forEach { (path, paint) -> canvas.drawPath(path, paint) }
              }
          }

          class DrawView(context: Context) : View(context) {
              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  DrawOverlay.draw(canvas)
                  invalidate()
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  when (event.action) {
                      MotionEvent.ACTION_DOWN -> DrawOverlay.begin(event.x, event.y)
                      MotionEvent.ACTION_MOVE -> DrawOverlay.move(event.x, event.y)
                      MotionEvent.ACTION_UP -> DrawOverlay.finish()
                  }
                  invalidate()
                  return true
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenInk-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
